<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5f8a" />
    <title>keijir のゲーム</title>
    <link rel="icon" href="./ocean/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
        background: linear-gradient(#2a8fb8, #1b5f8a);
        color: #23384a;
        padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 32px);
      }
      h1 { color: #fff; text-align: center; margin: 0 0 24px; font-size: 26px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2); }
      main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      a.game {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px;
        border-radius: 20px;
        background: #fffaf0;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }
      a.game:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
      a.game img { width: 72px; height: 72px; border-radius: 16px; flex: none; background: #2a8fb8; }
      a.game strong { display: block; font-size: 18px; }
      a.game span { display: block; font-size: 13px; color: #5d6d79; margin-top: 4px; line-height: 1.45; }
      .badge { display: inline-block; font-size: 11px; background: #f29d38; color: #fff; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
    </style>
  </head>
  <body>
    <h1>遊ぶゲームを選んでください</h1>
    <main>
      <a class="game" href="./jobwars3/">
        <img src="./jobwars3/icon-192.png" alt="" />
        <div><strong>JOB WARS 3<em class="badge">開発中</em></strong><span>JOB WARS 2 の防衛戦を、アニメ調の新しいグラフィックで作り直す版。</span></div>
      </a>
      <a class="game" href="./jobwars2/">
        <img src="./jobwars2/icon-192.png" alt="" />
        <div><strong>JOB WARS 2<em class="badge">試作</em></strong><span>タワーディフェンス版。決まった入口から本社へ進む仕事の怪物を、道ぞいの設備と主人公で食い止める。</span></div>
      </a>
      <a class="game" href="./jobwars/">
        <img src="./jobwars/icon-192.png" alt="" />
        <div><strong>JOB WARS<em class="badge">試作</em></strong><span>社会人サバイバーズ。職業の仲間を採用して部隊を育て、押し寄せる「仕事の怪物」から本社を守る。</span></div>
      </a>
      <a class="game" href="./ocean/">
        <img src="./ocean/icon-192.png" alt="" />
        <div><strong>Ocean Frontier<em class="badge">3D・開発中</em></strong><span>海上の小さな集落で、釣り・流木拾い・建設をしながら集落を育てる 3D 版。</span></div>
      </a>
      <a class="game" href="./ukishima/">
        <img src="./ukishima/icon-192.png" alt="" />
        <div><strong>しおさい浮島</strong><span>2D 版。加工・住民・開拓・留守中の生産まで遊べます。</span></div>
      </a>
    </main>
  </body>
</html>
